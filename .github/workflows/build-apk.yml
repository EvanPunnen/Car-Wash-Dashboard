name: Build Android APK and Deploy 24/7 Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Android APK & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build

      - name: Copy Web Bundle into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log || (echo "=== GRADLE FAILED ===" && tail -n 120 ../gradle.log && exit 1)

      - name: Stage APK for Release
        run: |
          mkdir -p build-output
          find android/ -name "*.apk" -exec cp {} build-output/MrDodo-CarWash.apk \;
          ls -la build-output/
          # Also copy APK to dist so it is directly downloadable from GitHub Pages
          cp build-output/MrDodo-CarWash.apk dist/MrDodo-CarWash.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrDodo-CarWash-APK
          path: build-output/MrDodo-CarWash.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: release-apk-latest
          name: "Mr. DODO Car Wash APK (Offline Edition)"
          body: |
            ### 🚗 Mr. DODO Premium Detailing & Billing App
            **Standalone Android APK for 100% Offline & Mobile Use**
            
            - **No Laptop Needed:** Runs independently on your Android phone.
            - **No Internet Needed:** All billing, vehicle bay tracking, and PDF generation work offline.
            - **Installation:** Download `MrDodo-CarWash.apk`, open it on your phone, and tap **Install**.
          files: build-output/MrDodo-CarWash.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Permanent 24/7 Web App to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
