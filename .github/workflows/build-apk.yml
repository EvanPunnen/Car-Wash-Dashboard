name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build

      - name: Sync Web Bundle to Capacitor Android
        run: npx cap copy android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MrDodo-CarWash.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrDodo-CarWash-APK
          path: build-output/MrDodo-CarWash.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: release-apk-latest
          name: "Mr. DODO Car Wash APK (Offline Edition)"
          body: |
            ### 🚗 Mr. DODO Premium Detailing & Billing App
            **Standalone Android APK for Offline & Mobile Use**
            
            - **No Laptop Needed:** Runs independently on your Android phone.
            - **No Internet Needed:** All billing, vehicle bay tracking, and PDF generation work offline.
            - **Installation:** Download `MrDodo-CarWash.apk`, open it on your phone, and tap **Install**.
          files: build-output/MrDodo-CarWash.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
